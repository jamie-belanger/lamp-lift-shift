#
# The MySQL  Server configuration file.
#
# For explanations see
# http://dev.mysql.com/doc/mysql/en/server-system-variables.html

[mysqld]
pid-file	= /var/run/mysqld/mysqld.pid
socket		= /var/run/mysqld/mysqld.sock
datadir		= /var/lib/mysql
#log-error	= /var/log/mysql/error.log

# Disabling symbolic-links is recommended to prevent assorted security risks
symbolic-links=0

# The default buffer pool size of 128M keeps memory usage low.
# However, if your app has a large database then performance will tank due to disk paging.
# If you have the RAM then increasing this will help a lot with overall performance.
# 
# We'll set the pool to 2 GB ... if you have a small amount of RAM (like 8 GB) you may want to comment this out:
innodb_buffer_pool_size = 2G

# Set UTF-8 as standard
collation-server = utf8mb4_general_ci
init-connect='SET NAMES utf8mb4'
character-set-server = utf8mb4
